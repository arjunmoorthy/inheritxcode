# =============================================================================
# OncoLife Monolith - Docker Compose Configuration
# =============================================================================
# This file orchestrates all services for local development and testing.
#
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose up patient-api  # Start specific service
#   docker-compose logs -f         # View logs
#   docker-compose down            # Stop all services
#
# =============================================================================

services:
  # ===========================================================================
  # DATABASES
  # ===========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: oncolife-postgres
    environment:
      POSTGRES_USER: oncolife_admin
      POSTGRES_PASSWORD: oncolife_dev_password
      POSTGRES_MULTIPLE_DATABASES: oncolife_patient,oncolife_doctor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncolife_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oncolife-network

  # ===========================================================================
  # BACKEND APIS (Internal - no direct external access)
  # ===========================================================================

  patient-api:
    build:
      context: ./apps/patient-platform/patient-api
      dockerfile: Dockerfile
    container_name: oncolife-patient-api
    environment:
      # Application
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
      - LOCAL_DEV_MODE=true
      # # Patient Database
      # - PATIENT_DB_HOST=postgres
      # - PATIENT_DB_PORT=5432
      # - PATIENT_DB_USER=oncolife_admin
      # - PATIENT_DB_PASSWORD=oncolife_dev_password
      # - PATIENT_DB_NAME=oncolife_patient
      # # Doctor Database (read-only)
      # - DOCTOR_DB_HOST=postgres
      # - DOCTOR_DB_PORT=5432
      # - DOCTOR_DB_USER=oncolife_admin
      # - DOCTOR_DB_PASSWORD=oncolife_dev_password
      # - DOCTOR_DB_NAME=oncolife_doctor
      # Doctor Database (primary) - LIVE RDS
      - DOCTOR_DB_HOST=oncolife-uat.c1om2gk4ycxn.us-east-2.rds.amazonaws.com
      - DOCTOR_DB_PORT=5432
      - DOCTOR_DB_USER=oncoife-doctor
      - DOCTOR_DB_PASSWORD=1FeusXaVR6JMP272Fgbb
      - DOCTOR_DB_NAME=oncolife-doctor-db
      # Patient Database (read-only) - LIVE RDS
      - PATIENT_DB_HOST=oncolife-uat.c1om2gk4ycxn.us-east-2.rds.amazonaws.com
      - PATIENT_DB_PORT=5432
      - PATIENT_DB_USER=oncolife-patient
      - PATIENT_DB_PASSWORD=f1HV9hz823qcmeVap2i4
      - PATIENT_DB_NAME=oncolife-patient-db
      # AWS
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      # Cognito
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET:-}
      # S3 Buckets
      - S3_REFERRAL_BUCKET=${S3_REFERRAL_BUCKET:-oncolife-referrals}
      - S3_EDUCATION_BUCKET=${S3_EDUCATION_BUCKET:-oncolife-education}
      # CORS
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:3000,https://oncolife-patient.inheritxdev.in,https://oncolife-patient-api.inheritxdev.in
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/patient-platform/patient-api/src:/app:cached
      - ./apps/patient-platform/patient-api/static:/app/static:cached
      - ./apps/patient-platform/patient-api/alembic:/app/alembic:cached
      - ./apps/patient-platform/patient-api/alembic.ini:/app/alembic.ini:cached
      - ./apps/patient-platform/patient-api/scripts:/app/scripts:cached
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oncolife-network

  doctor-api:
    build:
      context: ./apps/doctor-platform/doctor-api
      dockerfile: Dockerfile
    container_name: oncolife-doctor-api
    env_file:
      - ./apps/doctor-platform/doctor-api/.env
    environment:
      # Application
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
      - LOCAL_DEV_MODE=true
      # Doctor Database (primary) - LIVE RDS
      - DOCTOR_DB_HOST=oncolife-uat.c1om2gk4ycxn.us-east-2.rds.amazonaws.com
      - DOCTOR_DB_PORT=5432
      - DOCTOR_DB_USER=oncoife-doctor
      - DOCTOR_DB_PASSWORD=1FeusXaVR6JMP272Fgbb
      - DOCTOR_DB_NAME=oncolife-doctor-db
      # Patient Database (read-only) - LIVE RDS
      - PATIENT_DB_HOST=oncolife-uat.c1om2gk4ycxn.us-east-2.rds.amazonaws.com
      - PATIENT_DB_PORT=5432
      - PATIENT_DB_USER=oncolife-patient
      - PATIENT_DB_PASSWORD=f1HV9hz823qcmeVap2i4
      - PATIENT_DB_NAME=oncolife-patient-db
      # AWS
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      # Cognito
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET:-}
      # CORS
      - CORS_ORIGINS=http://localhost:3001,http://localhost:5174,http://127.0.0.1:5174,http://127.0.0.1:3001,https://oncolife-doctor.inheritxdev.in,https://oncolife-doctor-api.inheritxdev.in
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretkey}
      # Mail (MAIL_USERNAME, MAIL_PASSWORD, etc. loaded from env_file: doctor-api/.env above)
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-true}
      - MAIL_SSL_TLS=${MAIL_SSL_TLS:-false}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/doctor-platform/doctor-api/src:/app:cached
      - ./apps/doctor-platform/doctor-api/alembic:/app/alembic:cached
      - ./apps/doctor-platform/doctor-api/alembic.ini:/app/alembic.ini:cached
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oncolife-network

  # ===========================================================================
  # BACKEND FOR FRONTEND (BFF)
  # ===========================================================================

  patient-server:
    build:
      context: .
      dockerfile: apps/patient-platform/patient-server/Dockerfile
    container_name: oncolife-patient-server
    environment:
      - NODE_ENV=development
      - PORT=3000
      - PATIENT_API_URL=http://patient-api:8000
    ports:
      - "3000:3000"
    depends_on:
      - patient-api
    volumes:
      - ./apps/patient-platform/patient-server:/app/apps/patient-platform/patient-server:cached
      - /app/apps/patient-platform/patient-server/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oncolife-network

  # ===========================================================================
  # FRONTENDS (Optional - run locally with npm for hot reload)
  # ===========================================================================

  # NOTE: For development, run frontends locally with `npm run dev` for hot reload
  # Docker builds are for production testing only
  patient-web:
    build:
      # Context must be monorepo root for shared packages (file: references)
      context: .
      dockerfile: apps/patient-platform/patient-web/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost/api/v1
        - VITE_WS_BASE_URL=ws://localhost/ws
    container_name: oncolife-patient-web
    environment:
      - NODE_ENV=production
    ports:
      - "5173:80"
    depends_on:
      - patient-api
    networks:
      - oncolife-network

  doctor-web:
    build:
      # Context must be monorepo root for shared packages (file: references)
      context: .
      dockerfile: apps/doctor-platform/doctor-web/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost/doctor-api/api/v1
        - VITE_PATIENT_API_URL=http://localhost/api/v1
    container_name: oncolife-doctor-web
    environment:
      - NODE_ENV=production
    ports:
      - "5174:80"
    depends_on:
      - doctor-api
    networks:
      - oncolife-network

  # ===========================================================================
  # NGINX REVERSE PROXY (Handles custom domains)
  # ===========================================================================

  nginx:
    image: nginx:alpine
    container_name: oncolife-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - patient-api
      - doctor-api
      - patient-web
      - doctor-web
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oncolife-network
    restart: unless-stopped

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  oncolife-network:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    driver: local



