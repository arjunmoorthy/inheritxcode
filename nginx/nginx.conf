# OncoLife - Unified Nginx Proxy Configuration
# =============================================
# This configuration handles all domains and routes to appropriate containers

# ===========================================================================
# DOCTOR API
# ===========================================================================

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name oncolife-doctor-api.inheritxdev.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name oncolife-doctor-api.inheritxdev.in;

    ssl_certificate /etc/letsencrypt/live/oncolife-doctor-api.inheritxdev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oncolife-doctor-api.inheritxdev.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://oncolife-doctor-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location /health {
        proxy_pass http://oncolife-doctor-api:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# ===========================================================================
# DOCTOR WEB
# ===========================================================================

server {
    listen 80;
    server_name oncolife-doctor.inheritxdev.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name oncolife-doctor.inheritxdev.in;

    ssl_certificate /etc/letsencrypt/live/oncolife-doctor.inheritxdev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oncolife-doctor.inheritxdev.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html/doctor-web;
    index index.html;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"doctor-web"}';
        add_header Content-Type application/json;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    location ~ /\. {
        deny all;
    }
}

