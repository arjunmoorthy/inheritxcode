# OncoLife - Unified Nginx Proxy Configuration
# ============================================
# Enabled after the shared certificate exists at:
# /etc/letsencrypt/live/healthai.global/

server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx-proxy"}';
        add_header Content-Type application/json;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name api.doctor.healthai.global;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.doctor.healthai.global;

    ssl_certificate /etc/letsencrypt/live/healthai.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healthai.global/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://oncolife-doctor-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location = /health {
        if ($request_method = HEAD) {
            add_header Content-Type application/json;
            return 200;
        }

        proxy_pass http://oncolife-doctor-api:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

