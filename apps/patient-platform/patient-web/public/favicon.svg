<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Safe padding: content in center 60% so it never looks cut in tab or maskable icon -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F7CAC"/>
      <stop offset="100%" style="stop-color:#3d6a94"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background with padding (safe area) -->
  <rect x="56" y="56" width="400" height="400" rx="80" ry="80" fill="url(#bg)"/>
  <!-- "O" for OncoLife - centered with comfortable margin -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="white" stroke-width="48"/>
</svg>
